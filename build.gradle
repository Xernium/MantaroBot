import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.4.2'
}

def ver = new Version(major: 8, minor: 2, revision: 2)
version = ver.toString()

application {
    mainClass = "net.kodehawa.mantarobot.MantaroBot"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal() // Deploy testing for imageboard-api
}

dependencies {
    // Base
    implementation 'net.dv8tion:JDA:6.4.1'
    implementation 'club.minnced:discord-webhooks:0.8.4' // TODO: Reconsider this

    // JSON
    implementation 'tools.jackson.core:jackson-core:3.2.0'
    implementation 'tools.jackson.core:jackson-databind:3.2.0'

    // Core
    implementation 'io.github.classgraph:classgraph:4.8.184'
    implementation 'ch.qos.logback:logback-classic:1.5.33'
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    // Database
    implementation 'org.mongodb:mongodb-driver-sync:5.8.0'
    implementation 'io.valkey:valkey-java:5.5.0'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'io.github.kodehawa:imageboard-api:3.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Prometheus
    implementation 'io.prometheus:simpleclient:0.16.0'
    implementation 'io.prometheus:simpleclient_hotspot:0.16.0'
    implementation 'io.prometheus:simpleclient_httpserver:0.16.0'

    // Unit tests
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('generateLanguageList') {
    def languagesDir = layout.projectDirectory.dir("src/main/resources/assets/languages").asFile
    def listFile = layout.projectDirectory.file("src/main/resources/assets/languages/list.txt").asFile

    doLast {
        def out = new PrintStream(new FileOutputStream(listFile))
        languagesDir.listFiles().each {
            if (it.getName().endsWith("json")) {
                out.println(it.getName())
            }
        }

        out.close()
    }
}

tasks.register('ci') {
    dependsOn shadowJar
}

def lint = [
        "auxiliaryclass",
        "cast",
        "classfile",
        "deprecation",
        "dep-ann",
        "divzero",
        "empty",
        "exports",
        "fallthrough",
        "finally",
        "module",
        "opens",
        "options",
        "overloads",
        "overrides",
        "path",
        // removed because of "No processor claimed any of these annotations: ..."
        //"processing",
        "rawtypes",
        "removal",
        "requires-automatic",
        "requires-transitive-automatic",
        // removed because "non-transient instance field of a serializable class declared with a non-serializable type",
        // believe me i know
        //"serial",
        "static",
        "try",
        "unchecked",
        "varargs",
        "preview"
]

def gitRevision() {
    def gitVersion = new ByteArrayOutputStream()
    def gitError = new ByteArrayOutputStream()
    def gitProcess = ["git", "rev-parse", "--short", "HEAD"].execute(null, project.rootDir)
    gitProcess.consumeProcessOutput(gitVersion, gitError)

    if (gitProcess.waitFor() != 0) {
        throw new GradleException("Failed to read git revision: ${gitError.toString().trim()}")
    }

    return gitVersion.toString().trim()
}

tasks.register('sourcesForRelease', Copy) {
    from('src/main/java') {
        include '**/MantaroInfo.java'
        filter(ReplaceTokens, tokens: [
                version : ver.toString(),
                revision: gitRevision().toString()
        ])
    }
    into 'build/filteredSrc'

    includeEmptyDirs = false
}

tasks.register('generateJavaSources', SourceTask) {
    def javaSources = sourceSets.main.allJava.filter {
        it.name != 'MantaroInfo.java'
    }
    source = javaSources + sourcesForRelease.destinationDir

    dependsOn sourcesForRelease
}

compileJava {
    source = generateJavaSources.source
    classpath = sourceSets.main.compileClasspath
    options.compilerArgs += ["-Xlint:${lint.join(",")}"]

    dependsOn generateJavaSources
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.fork = true
    // This works around issues when compiling with Java 25+ due to capsulation changes
    options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    ]
}

shadowJar {
    archiveClassifier.set(null)
    exclude 'module-info.class'
}

test {
    useJUnitPlatform()
}

// Damned Gradle 8(+)
compileJava.dependsOn generateLanguageList
distZip.dependsOn shadowJar
distTar.dependsOn shadowJar
startScripts.dependsOn shadowJar
startShadowScripts.dependsOn jar

test.dependsOn generateLanguageList
build.dependsOn shadowJar

class Version {
    String major, minor, revision

    String toString() {
        "${major}.${minor}.${revision}"
    }
}
